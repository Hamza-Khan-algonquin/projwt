name: projwt_ios
description: ProjWT — Control your Tesla via wearable gestures. Live biometric dashboard.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP + WebSocket
  http: ^1.1.0
  web_socket_channel: ^2.4.0

  # State management
  provider: ^6.0.0

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0

  # BLE (iOS)
  flutter_blue_plus: ^1.31.0

  # Local notifications
  flutter_local_notifications: ^15.0.0

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_linter: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
