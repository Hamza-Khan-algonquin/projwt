name: projwt_ios_app
description: "ProjWT - Tesla Vehicle Control via WHOOP Band Integration"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Theme
  cupertino_icons: ^1.0.8
  material_color_utilities: ^0.13.0

  # State Management
  provider: ^6.4.0

  # HTTP & API
  dio: ^5.4.0
  http: ^1.1.0

  # BLE (WHOOP Band Integration)
  flutter_blue_plus: ^1.30.0

  # Biometric Data
  permission_handler: ^11.0.0

  # Storage (Secure Credentials)
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Connectivity Monitoring
  connectivity_plus: ^5.1.0

  # Charts & Data Visualization
  fl_chart: ^0.64.0

  # Logging & Debugging
  logger: ^2.0.0

  # UUID Generation
  uuid: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/

  # Fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 300
