name: projwt_ios_app
description: "ProjWT - Tesla Vehicle Control via WHOOP Band Integration"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Theme
  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.0.0

  # BLE (WHOOP Band)
  flutter_blue_plus: ^1.30.0

  # HTTP (Tesla API)
  dio: ^5.3.0

  # Local Storage
  shared_preferences: ^2.2.0

  # Charts
  fl_chart: ^0.64.0

  # Logging
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  test: ^1.24.0

flutter:
  uses-material-design: true
